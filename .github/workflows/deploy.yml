name: deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

# Terraform's own state lock serializes the apply steps, but it releases
# before the S3/CloudFront steps below -- two pushes to main close together
# could otherwise interleave writes and leave the older build's index.html
# live. Queue rather than cancel: cancelling mid-run could land between the
# asset sync and the index.html cp, which is the one window the bucket is
# genuinely inconsistent in.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # #11: every fresh checkout (CI always starts from one) has no
      # workspace selected on disk until told otherwise -- without this,
      # `init` picks Terraform's own built-in "default" workspace, and this
      # job would silently plan/apply against that (empty) one instead of
      # "prod". Set at the job level, not as a `terraform workspace select`
      # step, so it's read independently by every `terraform` invocation
      # (init/plan/apply/output all pick it up on their own) rather than
      # depending on an earlier step's on-disk selection still being correct
      # by the time a later step runs. Still fails loudly, the property a
      # `select` step would otherwise be the only thing providing: if "prod"
      # doesn't exist in the backend, `terraform init` errors ("workspace
      # ... does not exist") rather than silently creating it or falling
      # back to "default" -- verified directly before relying on it here.
      # Added after a local workspace-selection mixup (root cause never
      # fully confirmed, leading theory was `terraform workspace show`
      # returning inconsistent answers within one session) briefly took prod
      # down during this same PR's own migration -- this doesn't depend on
      # that same on-disk selection state being trustworthy the way a
      # `select` step alone does.
      TF_WORKSPACE: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda
          zip lambda.zip bootstrap

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        # Bucket comes from vars.TF_STATE_BUCKET (bootstrap output), but the
        # lock table name and region here are hardcoded to match
        # bootstrap/main.tf's fixed literal and its default region. An
        # account bootstrapped with a different region would have a working
        # manual deploy path (which derives from bootstrap outputs) but a
        # broken CI path that fails here without naming the region as the
        # cause.
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=undergroundbb-tfstate-lock" \
            -backend-config="region=us-west-2"
        working-directory: terraform

      - name: terraform plan
        run: terraform plan -out=tfplan
        working-directory: terraform
        env:
          TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: terraform apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: terraform output
        id: tf
        run: |
          set -euo pipefail
          bucket=$(terraform output -raw frontend_bucket_name)
          dist=$(terraform output -raw cloudfront_distribution_id)
          if [ -z "$bucket" ] || [ -z "$dist" ]; then
            echo "terraform output returned an empty value" >&2
            exit 1
          fi
          echo "frontend_bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$dist" >> "$GITHUB_OUTPUT"
        working-directory: terraform

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web install
        run: npm ci
        working-directory: web

      - name: web build
        run: npm run build
        working-directory: web

      # Two passes, no --delete: hashed assets land before index.html
      # references them, and nothing already-live is removed in the same
      # pass a client could be mid-load against. Orphaned prior-build
      # assets are left for a separate cleanup pass once no cached shell
      # can still reference their hashes.
      - name: frontend deploy
        run: |
          set -euo pipefail
          bucket="${{ steps.tf.outputs.frontend_bucket }}"
          aws s3 sync web/dist "s3://$bucket" --exclude index.html
          aws s3 cp web/dist/index.html "s3://$bucket/index.html"

      # #8's cache policy already gives index.html a short TTL specifically
      # so a deploy is visible quickly without this, but invalidating makes
      # it immediate rather than waiting out the TTL.
      - name: cloudfront invalidation
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths '/*'
