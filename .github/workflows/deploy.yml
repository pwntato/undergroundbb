name: deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda
          zip lambda.zip bootstrap

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        # Bucket comes from vars.TF_STATE_BUCKET (bootstrap output), but the
        # lock table name and region here are hardcoded to match
        # bootstrap/main.tf's fixed literal and its default region. An
        # account bootstrapped with a different region would have a working
        # manual deploy path (which derives from bootstrap outputs) but a
        # broken CI path that fails here without naming the region as the
        # cause.
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=undergroundbb-tfstate-lock" \
            -backend-config="region=us-west-2"
        working-directory: terraform

      - name: terraform plan
        run: terraform plan -out=tfplan
        working-directory: terraform
        env:
          TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: terraform apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: terraform output
        id: tf
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
        working-directory: terraform

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web install
        run: npm ci
        working-directory: web

      - name: web build
        run: npm run build
        working-directory: web

      # --delete removes objects from a prior deploy no longer in this
      # build (e.g. renamed hashed assets) so the bucket never accumulates
      # orphans; #7's versioning still keeps them recoverable.
      - name: frontend deploy
        run: aws s3 sync web/dist "s3://${{ steps.tf.outputs.frontend_bucket }}" --delete

      # #8's cache policy already gives index.html a short TTL specifically
      # so a deploy is visible quickly without this, but invalidating makes
      # it immediate rather than waiting out the TTL.
      - name: cloudfront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths '/*'
