name: test

on:
  pull_request:
  push:
    branches:
      - main
  # A job can go from no-op to live between merges with no PR of its own to
  # prove it (e.g. #81 merging go.mod). Without this, the first real signal
  # that a newly-live job works is whichever unrelated PR opens next, and a
  # failure there reads as that PR's fault. This makes confirming the
  # transition a button push instead of a throwaway PR or an empty commit.
  workflow_dispatch:

# A PR that is force-pushed or updated supersedes its own in-flight run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job below runs unconditionally so its name is always reported
  # (branch protection requires a check that always arrives; a job skipped
  # by `if:` reports nothing to satisfy the rule), and no-ops when the code
  # it tests is absent from `main` at this commit. `go` and `crypto-vectors`
  # went live once #81 merged go.mod; `web` went live once #82 merged
  # web/package.json; `terraform` once #4-#11 add terraform/. Every step
  # here activates on its own as that code lands, with no edit to this file.
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      web: ${{ steps.check.outputs.web }}
      terraform: ${{ steps.check.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          test -f go.mod            && echo "go=true"        >> "$GITHUB_OUTPUT" || echo "go=false"        >> "$GITHUB_OUTPUT"
          test -f web/package.json  && echo "web=true"       >> "$GITHUB_OUTPUT" || echo "web=false"       >> "$GITHUB_OUTPUT"
          test -d terraform         && echo "terraform=true" >> "$GITHUB_OUTPUT" || echo "terraform=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  go:
    needs: detect
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: localuser
      AWS_SECRET_ACCESS_KEY: localpassword
      AWS_DEFAULT_REGION: us-west-2

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - if: needs.detect.outputs.go != 'true'
        run: 'echo "No go.mod at this commit - nothing to build yet (see issue 2)."'

      - if: needs.detect.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The single-table schema is DESIGN.md's: PK/SK plus GSI1, whose sparse
      # PUBLIC#<shard> entries are the public-group directory.
      - name: init DynamoDB table
        if: needs.detect.outputs.go == 'true'
        run: |
          for i in $(seq 1 20); do
            aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 2>/dev/null && break || sleep 1
          done
          aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 > /dev/null || \
            (echo "DynamoDB Local did not become ready in time"; exit 1)
          aws dynamodb create-table \
            --endpoint-url http://127.0.0.1:8000 \
            --table-name undergroundbb \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
              AttributeName=GSI1PK,AttributeType=S \
              AttributeName=GSI1SK,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --global-secondary-indexes '[{"IndexName":"GSI1","KeySchema":[{"AttributeName":"GSI1PK","KeyType":"HASH"},{"AttributeName":"GSI1SK","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
            --billing-mode PAY_PER_REQUEST

      - name: go build
        if: needs.detect.outputs.go == 'true'
        run: go build ./...

      - name: go vet
        if: needs.detect.outputs.go == 'true'
        run: go vet ./...

      # -race is not optional here: the design has five contested writes
      # (signup, username claim, comment ordinal, challenge delete, invite
      # acceptance, credential re-wrap) whose tests exercise concurrency.
      - name: go test
        if: needs.detect.outputs.go == 'true'
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          TABLE_NAME: undergroundbb
        run: go test ./... -race

      - name: golangci-lint
        if: needs.detect.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.0

  web:
    needs: detect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - if: needs.detect.outputs.web != 'true'
        run: 'echo "No web/package.json at this commit - nothing to build yet (see issue 3)."'
        working-directory: .

      - if: needs.detect.outputs.web == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        if: needs.detect.outputs.web == 'true'
        run: npm ci

      - name: typecheck
        if: needs.detect.outputs.web == 'true'
        run: npm run typecheck

      - name: lint
        if: needs.detect.outputs.web == 'true'
        run: npm run lint

      - name: format check
        if: needs.detect.outputs.web == 'true'
        run: npm run format:check

      - name: build
        if: needs.detect.outputs.web == 'true'
        run: npm run build

  terraform:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - if: needs.detect.outputs.terraform != 'true'
        run: 'echo "No terraform/ directory at this commit - nothing to validate yet (see issues 4-11)."'

      - if: needs.detect.outputs.terraform == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: fmt check
        if: needs.detect.outputs.terraform == 'true'
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: validate
        if: needs.detect.outputs.terraform == 'true'
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  # The crypto vectors are a separate required check on purpose. They are the one
  # thing a round-trip test cannot substitute for (DESIGN.md "Testing"): encrypt
  # and decrypt can both be wrong in the same way and still agree. Folding them
  # into the `go` job would let a future edit disable them without the branch
  # protection rule noticing that a required check had changed meaning.
  crypto-vectors:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - if: needs.detect.outputs.go != 'true'
        run: 'echo "No go.mod at this commit - crypto vectors land with M2 (issues 20 / 24)."'

      - if: needs.detect.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # This step runs the Go half of the shared vector suite (#20/#24):
      # internal/crypto/testdata/vectors.json, checked by
      # internal/crypto/vectors_test.go. A red check here means the key
      # derivation, AAD binding, signed payloads or fingerprint encoding
      # changed — each of which locks out every existing user irreversibly.
      #
      # THE TYPESCRIPT LEG DOES NOT EXIST YET. #24 asks for both
      # implementations to consume this same JSON file, but the TypeScript
      # crypto itself (#21 Argon2id/WASM, #22 WebCrypto primitives) hasn't
      # been written, so there is nothing to run here on that side. Add a
      # `web` step consuming testdata/vectors.json once #21/#22 land — until
      # then this job verifies only that the Go implementation matches the
      # checked-in vectors, not that the two implementations agree with each
      # other, which is the actual point of #24.
      #
      # The vector file and suite are REQUIRED to exist from this commit
      # onward — this is a required status check on main, and the earlier
      # "not present yet" escape hatch that made sense before #20 landed
      # would now be a silent bypass: delete both testdata/vectors.json and
      # vectors_test.go and that guard used to print a message and exit 0,
      # turning a required check into a no-op that still reports success.
      # Missing either file is now a hard failure instead.
      #
      # The run is recursive (./internal/crypto/...) so a vector suite living in
      # a subpackage (e.g. internal/crypto/kdf) is still exercised and its
      # failures still fail this job. That means a plain "no tests to run" grep
      # can't tell "the vectors didn't match -run 'Vector'" apart from "an
      # unrelated sibling subpackage has no Vector-named test", and printing
      # "[no test files]" for a package the guard tripped on via the flat
      # testdata/ directory alone is a third case the same negative grep can't
      # see either. So the check gates on a POSITIVE signal instead: `-v` makes
      # `go test` print "--- PASS: <name>" for every test that actually ran, so
      # requiring at least one `--- PASS: .*Vector` line only trips when a
      # Vector-named test genuinely executed, regardless of what any other
      # package in the tree printed. Fail loudly if that signal is absent,
      # rather than inferring "it ran" from "it didn't error". A genuine test
      # failure exits on `go test`'s own status before this check, so the
      # PASS-grep only ever adjudicates a green run: vectors passed, or
      # nothing matched and there was nothing to pass.
      - name: crypto test vectors
        if: needs.detect.outputs.go == 'true'
        run: |
          set -o pipefail
          if [ ! -f internal/crypto/testdata/vectors.json ]; then
            echo "::error::internal/crypto/testdata/vectors.json is missing - the vector suite must exist (#20)."
            exit 1
          fi
          go test ./internal/crypto/... -run 'Vector' -v 2>&1 | tee vectors.log || test_exit=$?
          if [ "${test_exit:-0}" -ne 0 ]; then
            exit "$test_exit"
          fi
          if ! grep -q -- '--- PASS: .*Vector' vectors.log; then
            echo "::error::Vector suite present but no test matched -run 'Vector' - the vectors did not execute."
            exit 1
          fi
