name: test

on:
  pull_request:
  push:
    branches:
      - main
  # A job can go from no-op to live between merges with no PR of its own to
  # prove it (e.g. #81 merging go.mod). Without this, the first real signal
  # that a newly-live job works is whichever unrelated PR opens next, and a
  # failure there reads as that PR's fault. This makes confirming the
  # transition a button push instead of a throwaway PR or an empty commit.
  workflow_dispatch:

# A PR that is force-pushed or updated supersedes its own in-flight run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job below runs unconditionally so its name is always reported
  # (branch protection requires a check that always arrives; a job skipped
  # by `if:` reports nothing to satisfy the rule), and no-ops when the code
  # it tests is absent from `main` at this commit. `go` and `crypto-vectors`
  # went live once #81 merged go.mod; `web` goes live once #82 merges
  # web/package.json; `terraform` once #4-#11 add terraform/. Every step
  # here activates on its own as that code lands, with no edit to this file.
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      web: ${{ steps.check.outputs.web }}
      terraform: ${{ steps.check.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          test -f go.mod            && echo "go=true"        >> "$GITHUB_OUTPUT" || echo "go=false"        >> "$GITHUB_OUTPUT"
          test -f web/package.json  && echo "web=true"       >> "$GITHUB_OUTPUT" || echo "web=false"       >> "$GITHUB_OUTPUT"
          test -d terraform         && echo "terraform=true" >> "$GITHUB_OUTPUT" || echo "terraform=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  go:
    needs: detect
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: localuser
      AWS_SECRET_ACCESS_KEY: localpassword
      AWS_DEFAULT_REGION: us-west-2

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - if: needs.detect.outputs.go != 'true'
        run: 'echo "No go.mod at this commit - nothing to build yet (see issue 2)."'

      - if: needs.detect.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The single-table schema is DESIGN.md's: PK/SK plus GSI1, whose sparse
      # PUBLIC#<shard> entries are the public-group directory.
      - name: init DynamoDB table
        if: needs.detect.outputs.go == 'true'
        run: |
          for i in $(seq 1 20); do
            aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 2>/dev/null && break || sleep 1
          done
          aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 > /dev/null || \
            (echo "DynamoDB Local did not become ready in time"; exit 1)
          aws dynamodb create-table \
            --endpoint-url http://127.0.0.1:8000 \
            --table-name undergroundbb \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S \
              AttributeName=SK,AttributeType=S \
              AttributeName=GSI1PK,AttributeType=S \
              AttributeName=GSI1SK,AttributeType=S \
            --key-schema \
              AttributeName=PK,KeyType=HASH \
              AttributeName=SK,KeyType=RANGE \
            --global-secondary-indexes '[{"IndexName":"GSI1","KeySchema":[{"AttributeName":"GSI1PK","KeyType":"HASH"},{"AttributeName":"GSI1SK","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
            --billing-mode PAY_PER_REQUEST

      - name: go build
        if: needs.detect.outputs.go == 'true'
        run: go build ./...

      - name: go vet
        if: needs.detect.outputs.go == 'true'
        run: go vet ./...

      # -race is not optional here: the design has five contested writes
      # (signup, username claim, comment ordinal, challenge delete, invite
      # acceptance, credential re-wrap) whose tests exercise concurrency.
      - name: go test
        if: needs.detect.outputs.go == 'true'
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          TABLE_NAME: undergroundbb
        run: go test ./... -race

      - name: golangci-lint
        if: needs.detect.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.0

  web:
    needs: detect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - if: needs.detect.outputs.web != 'true'
        run: 'echo "No web/package.json at this commit - nothing to build yet (see issue 3)."'
        working-directory: .

      - if: needs.detect.outputs.web == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        if: needs.detect.outputs.web == 'true'
        run: npm ci

      - name: typecheck
        if: needs.detect.outputs.web == 'true'
        run: npm run typecheck

      - name: lint
        if: needs.detect.outputs.web == 'true'
        run: npm run lint

      - name: format check
        if: needs.detect.outputs.web == 'true'
        run: npm run format:check

      - name: build
        if: needs.detect.outputs.web == 'true'
        run: npm run build

  terraform:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - if: needs.detect.outputs.terraform != 'true'
        run: 'echo "No terraform/ directory at this commit - nothing to validate yet (see issues 4-11)."'

      - if: needs.detect.outputs.terraform == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: fmt check
        if: needs.detect.outputs.terraform == 'true'
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: validate
        if: needs.detect.outputs.terraform == 'true'
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform

  # The crypto vectors are a separate required check on purpose. They are the one
  # thing a round-trip test cannot substitute for (DESIGN.md "Testing"): encrypt
  # and decrypt can both be wrong in the same way and still agree. Folding them
  # into the `go` job would let a future edit disable them without the branch
  # protection rule noticing that a required check had changed meaning.
  crypto-vectors:
    needs: detect
    runs-on: ubuntu-latest

    steps:
      - if: needs.detect.outputs.go != 'true'
        run: 'echo "No go.mod at this commit - crypto vectors land with M2 (issues 20 / 24)."'

      - if: needs.detect.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: needs.detect.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Until #24 lands there is no ./internal/crypto vector suite to run. When it
      # exists this step runs it and nothing else, so a red check here means the
      # key derivation, AAD binding, signed payloads or fingerprint encoding
      # changed — each of which locks out every existing user irreversibly.
      #
      # The presence guard below only decides WHETHER to run `go test -run
      # 'Vector'`; it says nothing about whether that run actually matched a
      # test. `go test -run` exits 0 and prints "no tests to run" when the
      # pattern matches nothing, so a vector suite whose test functions are
      # named e.g. TestArgon2idKAT rather than containing "Vector" -- an
      # entirely ordinary choice -- would pass this guard (via the testdata
      # arm or its own filename) and then execute zero vectors, silently and
      # permanently green. That is the exact failure DESIGN.md's Testing
      # section describes for a round-trip test, reproduced one level up,
      # in the check meant to catch it. So: fail loudly if the run matched
      # nothing, rather than inferring "it ran" from "it didn't error".
      - name: crypto test vectors
        if: needs.detect.outputs.go == 'true'
        run: |
          if ! ls internal/crypto/*vector*_test.go >/dev/null 2>&1 && \
             ! ls internal/crypto/testdata/*.json  >/dev/null 2>&1; then
            echo "Crypto vector suite not present yet (#24). This check goes live with M2."
            exit 0
          fi
          go test ./internal/crypto/... -run 'Vector' -v 2>&1 | tee /tmp/vectors.log
          if grep -q 'no tests to run' /tmp/vectors.log; then
            echo "::error::Vector suite present but no test matched -run 'Vector' - the vectors did not execute."
            exit 1
          fi
